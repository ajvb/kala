version: '3'

services:
  consul:
    image: hashicorp/consul:1.20
    ports:
      - "8500:8500"
    command: "agent -dev -client=0.0.0.0"
  redis:
    image: redis:4
    ports:
      - "6379:6379"
  mongo:
    image: mongo:3.4
    ports:
      - "27017:27017"
  postgres:
    image: postgres:10
    ports:
      - "5432:5432"
  mysql:
    image: mysql:5.7
    ports:
      - "3306:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
      MYSQL_DATABASE: test
#      TZ: Europe/Madrid  

