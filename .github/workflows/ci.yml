name: CI

on:
  push:
    branches: [master, v1, v2-dev, v2]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The server module is in the repository root and the Go client is its own
  # module in client/. Each job runs for both where it makes sense.
  build:
    name: build (go ${{ matrix.go }}, ${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27"]
        module: [".", "client"]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache-dependency-path: |
            go.sum
            client/go.sum
      - run: go mod verify
      - run: go build -trimpath ./...

  # Unit tests with the race detector, for the server module and the client
  # module.
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache-dependency-path: |
            go.sum
            client/go.sum
      - name: Test the server module
        run: go test -race -count=1 -timeout 300s ./...
      - name: Test the client module
        working-directory: client
        run: go test -race -count=1 -timeout 300s ./...

  # The integration tests (build tag "integration"): the storage tests start
  # their own database containers.
  integration:
    name: integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: |
            go.sum
            client/go.sum
      - name: Pull the images the storage tests use
        # Pulling is outside the tests' own time limits. Keep this list in step
        # with the containers started in job/storage/*.
        run: |
          for image in hashicorp/consul:1.20 mongo:3.4 mysql:5.7 postgres:11; do
            docker pull --quiet "$image" &
          done
          wait
      - run: go test -race -count=1 -timeout 300s -tags integration ./job/storage/... ./internal/...

  # Ported from the CircleCI configuration: build the binary, start the
  # server on Consul and create a job through the API.
  smoke:
    name: smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
          check-latest: true
      - name: Start Consul
        run: |
          docker run -d --name consul -p 8500:8500 hashicorp/consul:1.20 agent -dev -client=0.0.0.0
          for i in $(seq 1 20); do
            nc -z localhost 8500 && exit 0
            sleep 1
          done
          echo "Consul did not start" >&2
          exit 1
      - run: go build -trimpath -o bin/kala .
      - name: Start the server and create a job
        run: |
          ./bin/kala serve --jobdb=consul --jobdb-address=127.0.0.1:8500 -p 8000 > serve.log 2>&1 &
          echo $! > serve.pid
          status=$(curl --silent --output response.json --write-out '%{http_code}' \
            --retry 15 --retry-delay 1 --retry-connrefused \
            -X POST -H "Content-Type: application/json" \
            -d '{"command": "echo cool", "name": "test_job"}' \
            http://localhost:8000/api/v1/job/)
          cat response.json; echo
          kill "$(cat serve.pid)" || true
          if [ "$status" != "201" ]; then
            echo "expected HTTP 201, got $status" >&2
            cat serve.log >&2
            exit 1
          fi

  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: |
            go.sum
            client/go.sum
      - run: go vet -tags integration ./...
      - run: cd client && go vet -tags integration ./...

  # golangci-lint runs staticcheck, gosec, errcheck and the other linters in
  # .golangci.yml, for the server module and the client module.
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: |
            go.sum
            client/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: client

  # Scheduling code reads the time and starts timers only through its clock
  # (the clock package), so tests can control them.
  clock-usage:
    name: clock usage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No direct time calls in the job package
        run: |
          files=$(ls job/*.go | grep -v -E '_test\.go$|test_utils\.go$')
          if grep -nE 'time\.(Now|Since|Until|AfterFunc|NewTimer|After|Tick|Sleep)\(' $files; then
            echo "use the job's clock instead of the time package (see above)" >&2
            exit 1
          fi

  # One stable name for the branch ruleset to require, so the matrix above can
  # change (for example a new Go version) without editing the ruleset.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [build, test, integration, smoke, clock-usage, vet, lint]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "a required job did not succeed" >&2; exit 1; }
          done
