name: CI

on:
  push:
    branches: [main, v1, v2-dev, v2]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The server module is in the repository root and the Go client is its own
  # module in client/. Each job runs for both where it makes sense.
  build:
    name: build (go ${{ matrix.go }}, ${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27"]
        module: [".", "client"]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache-dependency-path: |
            go.sum
            client/go.sum
      - run: go mod verify
      - run: go build -trimpath ./...

  # Unit tests with the race detector, for the server module and the client
  # module.
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache-dependency-path: |
            go.sum
            client/go.sum
      - name: Test the server module
        run: go test -race -count=1 -timeout 300s ./...
      - name: Test the client module
        working-directory: client
        run: go test -race -count=1 -timeout 300s ./...

  # The integration tests (build tag "integration"): the storage tests start
  # their own database containers.
  integration:
    name: integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: |
            go.sum
            client/go.sum
      - name: Pull the images the storage tests use
        # Pulling is outside the tests' own time limits. Keep this list in step
        # with the containers started in job/storage/*.
        run: |
          for image in hashicorp/consul:1.20 mongo:3.4 mysql:5.7 postgres:11; do
            docker pull --quiet "$image" &
          done
          wait
      - run: go test -race -count=1 -timeout 300s -tags integration ./job ./job/storage/... ./internal/...

  # Ported from the CircleCI configuration: build the binary, start the
  # server on Consul and create a job through the API.
  smoke:
    name: smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
          check-latest: true
      - name: Start Consul
        run: |
          docker run -d --name consul -p 8500:8500 hashicorp/consul:1.20 agent -dev -client=0.0.0.0
          for i in $(seq 1 20); do
            nc -z localhost 8500 && exit 0
            sleep 1
          done
          echo "Consul did not start" >&2
          exit 1
      - run: go build -trimpath -o bin/kala .
      - name: Start the server and create a job
        run: |
          ./bin/kala serve --jobdb=consul --jobdb-address=127.0.0.1:8500 -p 8000 > serve.log 2>&1 &
          echo $! > serve.pid
          status=$(curl --silent --output response.json --write-out '%{http_code}' \
            --retry 15 --retry-delay 1 --retry-connrefused \
            -X POST -H "Content-Type: application/json" \
            -d '{"command": "echo cool", "name": "test_job"}' \
            http://localhost:8000/api/v1/job/)
          cat response.json; echo
          kill "$(cat serve.pid)" || true
          if [ "$status" != "201" ]; then
            echo "expected HTTP 201, got $status" >&2
            cat serve.log >&2
            exit 1
          fi

  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: |
            go.sum
            client/go.sum
      - run: go vet -tags integration ./...
      - run: cd client && go vet -tags integration ./...

  # golangci-lint runs staticcheck, gosec, errcheck and the other linters in
  # .golangci.yml, for the server module and the client module.
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: |
            go.sum
            client/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: client

  # Scheduling code reads the time and starts timers only through its clock
  # (the clock package), so tests can control them.
  clock-usage:
    name: clock usage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No direct time calls in the job package
        run: |
          files=$(ls job/*.go | grep -v -E '_test\.go$|test_utils\.go$')
          if grep -nE 'time\.(Now|Since|Until|AfterFunc|NewTimer|After|Tick|Sleep)\(' $files; then
            echo "use the job's clock instead of the time package (see above)" >&2
            exit 1
          fi

  # Build the release binary and check "kala version" reports what it was
  # built with, then build the container image (it is not published) and check
  # it reports the same version, runs as a non-root user, and serves the API.
  image:
    name: release build and image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: v0.0.0-ci
      BUILD_DATE: "2026-01-01T00:00:00Z"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: |
            go.sum
            client/go.sum
      - name: Release binary reports its version
        run: make check-version VERSION="$VERSION" COMMIT="$GITHUB_SHA" BUILD_DATE="$BUILD_DATE"
      - name: Build the image
        run: |
          docker build --build-arg VERSION="$VERSION" --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$BUILD_DATE" -t kala:ci .
      - name: The image reports its version and runs as a non-root user
        run: |
          docker run --rm kala:ci version | tee version.txt
          grep -qx "kala $VERSION" version.txt
          grep -qx "commit:     $GITHUB_SHA" version.txt
          uid=$(docker run --rm --entrypoint id kala:ci -u)
          echo "uid: $uid"
          [ "$uid" != "0" ]
      - name: The image serves the API
        run: |
          docker run -d --name kala -p 8000:8000 kala:ci
          status=$(curl --silent --output response.json --write-out '%{http_code}' \
            --retry 15 --retry-delay 1 --retry-connrefused \
            -X POST -H "Content-Type: application/json" \
            -d '{"command": "echo cool", "name": "test_job"}' \
            http://localhost:8000/api/v1/job/)
          cat response.json; echo
          docker logs kala
          [ "$status" = "201" ] || { echo "expected HTTP 201, got $status" >&2; exit 1; }
      - name: The image serves the web interface with its libraries
        run: |
          for path in webui/ webui/vendor/bulma/bulma.css webui/vendor/reef/reef.polyfills.min.js; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://localhost:8000/$path")
            echo "$path: $status"
            [ "$status" = "200" ] || exit 1
          done

  # Coverage per package, shown on the run's summary page and kept as a
  # downloadable profile. It only reports: no threshold, and the ci-ok job does
  # not wait for it. The integration tests need Docker and are left out.
  coverage:
    name: coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: |
            go.sum
            client/go.sum
      - name: Run the unit tests with coverage
        run: |
          set -o pipefail
          go test -count=1 -timeout 300s -coverprofile=coverage.out ./... | tee coverage.txt
      - name: Publish coverage per package
        if: always()
        run: |
          {
            echo "### Unit test coverage per package"
            echo
            echo "| Package | Coverage |"
            echo "| --- | --- |"
            # Packages without tests have no "ok" prefix, so match on the tab-separated
            # fields: the package is the second, the coverage is the last.
            awk -F'\t' '/coverage:/ { c = $NF; sub(/^coverage: /, "", c); sub(/ of statements.*/, "", c); print "| " $2 " | " c " |" }' coverage.txt
            echo "| **all packages** | **$(go tool cover -func=coverage.out | awk '/^total:/ { print $3 }')** |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-profile
          path: coverage.out

  # A short run of every fuzz target (.github/scripts/fuzz.sh). These logs are
  # public, so a failing target reports only what failed, never the input, and
  # no input is uploaded: reproduce a failure by running the target locally.
  fuzz-short:
    name: fuzz (short)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: |
            go.sum
            client/go.sum
      - run: .github/scripts/fuzz.sh 30s

  # Benchmarks of the pull request against its base branch, on the same
  # runner (.github/scripts/bench.sh). Fails if a benchmark is more than 20%
  # slower than the base, again on a re-run. The comparison is on the run's
  # summary page.
  bench:
    name: benchmarks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: |
            go.sum
            client/go.sum
      - name: Check out the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
      - name: Compare the benchmarks
        run: .github/scripts/bench.sh "$RUNNER_TEMP/base" . "$RUNNER_TEMP/bench"
      - name: Publish the comparison
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/bench/report.md" ]; then
            { echo "### Benchmarks (median ns/op, base vs. this pull request)"; echo; cat "$RUNNER_TEMP/bench/report.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi

  # One stable name for the branch ruleset to require, so the matrix above can
  # change (for example a new Go version) without editing the ruleset.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [build, test, integration, smoke, clock-usage, vet, lint, fuzz-short, image, bench]
    runs-on: ubuntu-latest
    steps:
      # The benchmarks run only on pull requests, so they may be skipped; every
      # other job must succeed. No results at all is a failure.
      - name: All required jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        shell: python3 {0}
        run: |
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          ok = bool(needs)
          for job, info in needs.items():
              result = info["result"]
              print(f"{job}: {result}")
              if result != "success" and not (job == "bench" and result == "skipped"):
                  ok = False
          if not ok:
              sys.exit("a required job did not succeed")
