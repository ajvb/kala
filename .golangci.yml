version: "2"

run:
  modules-download-mode: readonly

linters:
  enable:
    - asciicheck
    - bodyclose
    - dogsled
    - dupl
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - lll
    - misspell
    - mnd
    - nakedret
    - nestif
    - nolintlint
    - prealloc
    - rowserrcheck
    - unconvert
    - unparam
  settings:
    gocritic:
      enabled-tags:
        - performance
        - style
        - diagnostic
        - experimental
        - opinionated
      disabled-checks:
        - regexpMust
        - hugeParam
        - commentedOutCode
        - paramTypeCombine
        - whyNoLint
    govet:
      enable:
        - atomicalign
    misspell:
      locale: US
    mnd:
      checks:
        - argument
        - case
        - condition
        - operation
        - return
        - assign
      ignored-numbers:
        - "0.0"
        - "1.0"
    nolintlint:
      allow-unused: false
      require-explanation: true
      allow-no-explanation:
        - mnd
        - lll
      require-specific: true
    staticcheck:
      checks:
        - all
        # Error-string style rules that v1 code does not follow.
        - -ST1000
        - -ST1003
        - -ST1005
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    rules:
      # Exclude some linters from running on test files.
      - path: (_test\.go|test_utils\.go)
        linters:
          - bodyclose
          - dupl
          - errcheck
          - gocognit
          - goconst
          - gocyclo
          - gosec
          - lll
          - mnd
          - nestif
      - linters:
          - lll
        source: "(//|Errorf|Printf|logf|Fatalf|Flags|Wrapf|Newf|Warnf)"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: false

severity:
  default: error
